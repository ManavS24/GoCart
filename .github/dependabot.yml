version: 2
updates:
  # Without this, a pinned dependency never receives its patch releases.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      # Majors stay separate, so a breaking upgrade is always deliberate.
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
