name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run lint

      # No database, network or real credentials required.
      - run: npm test

      # Catches build-time breakage. Uses format-valid dummy Clerk keys because
      # pages wrapped in <ClerkProvider> are prerendered, and next build rejects
      # a malformed publishable key. `next build` is called directly to skip the
      # `prisma migrate deploy` step in the npm build script, which needs a live DB.
      - name: Build smoke test
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_YXVkaXQtZHVtbXktMTIuY2xlcmsuYWNjb3VudHMuZGV2JA==
          CLERK_SECRET_KEY: sk_test_ci_placeholder
        run: npx next build
